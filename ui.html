<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>选图工具</title>
<style>
  body{background:#18181b;color:#e9e9ec;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;margin:0;padding:0}
  h1{font-size:18px;margin:0}
  button{background:#33333c;color:#e9e9ec;border:1px solid #46464f;border-radius:6px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{background:#3d3d47}
  button:disabled{background:#2a2a31;color:#6a6a74;cursor:default;border-color:#33333c}
  button.pri{background:#27ae60;border-color:#27ae60;color:#04220f;font-weight:600}
  button.pri:hover{background:#2ec26c}
  button.pri:disabled{background:#2a4f3c;color:#5c7a68;border-color:#2a4f3c}
  input[type=number],input[type=text],select{background:#2a2a31;color:#eee;border:1px solid #3d3d46;border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
  input[type=number]{width:76px}
  input[type=text]{width:300px}
  label{font-size:13px;color:#c9c9d2;display:flex;align-items:center;gap:5px}
  .muted{color:#8f8f99}

  /* ---- 顶部队列条 ---- */
  #top{background:#202024;border-bottom:1px solid #2e2e36;padding:12px 16px}
  #top .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  #top .row1 .sp{flex:1}
  #folders{margin-top:10px;max-height:112px;overflow:auto;
           background:#17171a;border:1px solid #2e2e36;border-radius:8px;padding:6px}
  #folders:empty{display:none}
  .fitem{display:flex;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;font-size:12.5px}
  .fitem .p{color:#8f8f99;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .tag{font-size:11px;padding:1px 7px;border-radius:99px;background:#3a3a42;color:#bbb;white-space:nowrap}
  .fitem.run .tag{background:#f0c674;color:#3a2c00}
  .fitem.ok  .tag{background:#27ae60;color:#062}
  .fitem.err .tag{background:#c0392b;color:#fff}
  .fitem button{padding:1px 8px;font-size:12px}

  #status{margin-top:9px;font-size:12.5px;color:#8f8f99;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---- 筛选栏 ---- */
  #bar{background:#202024;border-bottom:1px solid #2e2e36;padding:10px 16px;position:sticky;top:0;z-index:20}
  #bar .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  #bar .row+.row{margin-top:9px}
  .stat{background:#242429;border-radius:8px;padding:5px 12px;font-size:12.5px}
  .stat b{font-size:16px}
  #bar .row .sp{flex:1}

  /* ---- 操作栏 ---- */
  #act{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  #dest{font-family:Consolas,monospace;font-size:12.5px}
  /* Ollama 地址 / 模型选择 / 拉取: 放在顶部栏, 启动后就能配 (不用先分析文件夹) */
  #ollamaCfg{margin-top:10px;padding-top:10px;border-top:1px solid #2e2e36;
             display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  #advModel{max-width:240px}
  #advHost{width:160px}
  #advPullName{width:200px}
  #advProg{font-size:12px}
  #advRun{font-size:12px}
  /* AI 实时输出: 单行; 外层右对齐, 文字比框宽时从左侧裁掉 -> 始终看到最新吐出的字符 */
  #advOut{flex:1 1 200px;min-width:140px;max-width:720px;overflow:hidden;
          display:flex;justify-content:flex-end}
  #advOutText{white-space:nowrap;font-family:Consolas,monospace;font-size:12px;color:#9a9aa2}

  /* ---- AI 调色建议面板 ---- */
  #advice{background:#202024;border-bottom:1px solid #2e2e36;padding:10px 16px;
          max-height:340px;overflow:auto}
  .advhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
  .advhead .sp{flex:1}
  .advhead b{font-size:13.5px}
  .advmodel{font-size:12px}
  .advtag{font-size:11px;padding:1px 7px;border-radius:99px;background:#3a3a42;color:#bbb}
  .advstyle{background:#17171a;border:1px solid #2e2e36;border-radius:8px;
            padding:7px 10px;font-size:12.5px;color:#c9c9d2;margin-bottom:8px}
  .advcols{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .advcol{flex:1;min-width:260px;background:#242429;border-radius:8px;padding:7px 10px}
  .advh{font-size:12px;color:#8f8f99;margin-bottom:3px}
  .advcol ul{margin:0;padding-left:18px;font-size:12.5px}
  .advcol li{margin:2px 0}
  .advnote{font-size:12px;color:#f0c674;margin-bottom:7px}
  .advtable{width:100%;border-collapse:collapse;font-size:12px}
  .advtable th{text-align:left;color:#8f8f99;font-weight:600;white-space:nowrap;
               padding:3px 8px 4px 0;border-bottom:1px solid #2e2e36}
  .advtable td{padding:3px 8px 3px 0;border-bottom:1px solid #232329;vertical-align:top}
  .advtable tr:last-child td{border-bottom:none}
  .advname{font-family:Consolas,monospace;color:#c9c9d2}
  .advnum{color:#7fd1a8;white-space:nowrap;text-align:right}
  .advreason{color:#a9a9b2;min-width:220px;max-width:460px}

  /* ---- 卡片 ---- */
  #grid{padding:4px 0 16px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;
         align-items:start;padding:0 16px}
  /* 分节标题: 组与组之间的分隔条, 可折叠 */
  .sec{margin-top:6px}
  .sechead{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;
           padding:9px 16px 7px;position:sticky;top:0;z-index:5;
           background:rgba(24,24,27,.94);backdrop-filter:blur(6px)}
  .sechead:hover{background:rgba(38,38,45,.96)}
  .sechead .caret{display:inline-block;width:11px;color:#8f8f99;transition:transform .12s}
  .sec.closed .caret{transform:rotate(-90deg)}
  .sec.closed .cards{display:none}
  .sechead .t{font-size:12.5px;color:#c9c9d2}
  .sechead .n{font-size:11.5px;color:#8f8f99}
  .sechead .tag{font-size:11px;padding:1px 7px;border-radius:99px;background:#3a3a42;color:#bbb}
  .sechead .tag.warn{background:#8a6d1f;color:#ffe9a8}
  #empty{padding:70px 20px;text-align:center;color:#8f8f99}
  .card{background:#242429;border-radius:10px;overflow:hidden;border:2px solid transparent;position:relative}
  .card.soft{border-color:#c0392b}
  .card.best{border-color:#27ae60}
  .card.sel{border-color:#2f7fd8}
  .card img{width:100%;display:block;cursor:zoom-in}
  .pick{position:absolute;top:7px;left:7px;z-index:3;background:rgba(0,0,0,.55);border-radius:5px;padding:2px 5px}
  .pick input{width:16px;height:16px;vertical-align:middle;cursor:pointer}
  .info{padding:8px 10px;font-size:12.5px}
  .name{font-weight:600;font-size:13px}
  .sc{color:#7fd1a8}
  .card.soft .sc{color:#ff8a80}
  .meta{color:#8f8f99;font-size:11.5px;margin-top:3px}
  .ops{margin-top:7px;display:flex;gap:6px}
  .op{background:#2f2f37;color:#c9c9d2;border:1px solid #43434d;border-radius:5px;
      padding:3px 8px;font:inherit;font-size:11.5px;cursor:pointer}
  .op:hover{background:#3a3a45;color:#fff}
  .op:active{background:#26262d}
  .facepick{margin-top:7px;display:flex;align-items:center;gap:6px}
  .facepick:empty{display:none}
  .fplab{font-size:11.5px;color:#8f8f99;flex:0 0 auto}
  .facepick select{background:#2a2a31;color:#ddd;border:1px solid #43434d;
                   border-radius:5px;padding:2px 5px;font:inherit;font-size:11.5px;
                   max-width:100%;cursor:pointer}
  .facepick select:hover{background:#33333c}
  .badge{float:right;font-size:11px;padding:1px 7px;border-radius:99px;background:#3a3a42;color:#bbb;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card.soft .badge{background:#c0392b;color:#fff}
  .card.best .badge{background:#27ae60;color:#062}
  .legend{color:#8f8f99;font-size:12px;line-height:1.9;padding:0 16px 4px}
  .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}

  /* ---- 大图 ---- */
  #lb{display:none;position:fixed;inset:0;background:rgba(8,8,10,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center;padding:18px}
  #lb img{max-width:96vw;max-height:80vh;object-fit:contain;background:#000}
  #lb .lt{margin-top:10px;font-size:13px;color:#ddd;display:flex;gap:14px;align-items:center}
  #lb .lt a{color:#7fd1a8;cursor:pointer}
  #lb .hint{color:#77777f;font-size:12px;margin-top:4px}
  .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#9a9aa2;cursor:pointer;user-select:none;padding:10px 18px}
  .nav:hover{color:#fff}
  #navL{left:6px} #navR{right:6px}
  #msg{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#242429;border:1px solid #3d3d46;
       color:#e9e9ec;padding:9px 18px;border-radius:8px;font-size:13px;z-index:200;display:none;max-width:80vw}
  #msg.bad{border-color:#c0392b;color:#ff8a80}
</style></head><body>

<div id="top">
  <div class="row1">
    <h1>选图工具</h1>
    <button id="bPick" class="pri">1. 选择照片文件夹(可多选)</button>
    <button id="bRun" disabled>2. 开始分析</button>
    <button id="bCancel" class="pri" style="display:none" disabled>取消</button>
    <label><input type="checkbox" id="cFull"> 全分辨率(慢一些)</label>
    <label><input type="checkbox" id="cForce"> 忽略缓存重扫</label>
    <div class="sp"></div>
    <span class="muted" style="font-size:12px">结果只在这个窗口里看, 不写照片文件夹</span>
  </div>
  <div id="ollamaCfg">
    <span class="muted" style="font-size:12px">Ollama</span>
    <input type="text" id="advHost" placeholder="127.0.0.1:11434" spellcheck="false" title="Ollama 服务地址 (主机:端口, 也可带 http:// 前缀)">
    <button id="bAdvSave" title="保存 Ollama 地址到工具目录的 cull_config.json">保存地址</button>
    <select id="advModel" title="选择用于调色建议的本地 Ollama 视觉模型">
      <option value="" disabled selected>正在读取模型…</option>
    </select>
    <button id="bAdvRefresh" title="重新读取本机 Ollama 已安装的视觉模型">刷新模型</button>
    <input type="text" id="advPullName" placeholder="拉取模型, 如 qwen2.5vl:7b" spellcheck="false">
    <button id="bAdvPull" title="向本机 Ollama 下载这个视觉模型 (可能几个 GB, 请耐心等进度)">拉取</button>
    <span id="advProg" class="muted"></span>
  </div>
  <div id="folders"></div>
  <div id="status">就绪 — 先选文件夹, 再点「开始分析」</div>
</div>

<div id="bar" style="display:none">
  <div class="row">
    <label>修图价值 &ge; <input type="number" id="fValue" min="0" max="100" step="5" placeholder="不限"></label>
    <label>眼部锐度 &ge; <input type="number" id="fSharp" step="50" placeholder="不限"></label>
    <label>组内占比 &ge; <input type="number" id="fRatio" min="0" max="100" step="5" placeholder="不限"> %</label>
    <label><input type="checkbox" id="fBest"> 只看组内胜出</label>
    <label><input type="checkbox" id="fMulti"> 只看有可比对对象的组</label>
    <label><input type="checkbox" id="fMultiFace"> 只看多脸</label>
    <label><input type="checkbox" id="fUncertain"> 只看主体存疑 ⚠</label>
    <label>对焦依据
      <select id="fFace"><option value="">全部</option><option value="1">有人脸</option><option value="0">无脸</option></select>
    </label>
    <label>AF区域 <select id="fArea"><option value="">全部</option></select></label>
    <label>排序 <select id="fSort">
      <option value="sharp">按锐度 (默认)</option>
      <option value="value">按修图价值</option>
      <option value="group">按分组, 同组放一起</option>
      <option value="name">按文件名, 同组放一起</option>
    </select></label>
    <button id="bReset">重置</button>
  </div>
  <div class="row" id="act">
    <span class="stat" style="margin:0">显示 <b id="vcount">0</b> / <b id="tcount">0</b> 张</span>
    <span class="stat" style="margin:0">已勾选 <b id="scount">0</b> 张</span>
    <button id="bAll">全选可见</button>
    <button id="bNone">清空</button>
    <button id="bInv">反选可见</button>
    <div class="sp"></div>
    <input type="text" id="dest" placeholder="目标文件夹" spellcheck="false">
    <button id="bDest">选择目标…</button>
    <label style="white-space:nowrap" title="给挑中的每张照片额外生成一张预览 jpg, 集中放到一个文件夹, 方便 AI/别人直接看图">
      <input type="checkbox" id="cPrev"> 生成预览 jpg
    </label>
    <input type="text" id="prevDir" placeholder="预览图放到…" spellcheck="false" style="width:230px" disabled>
    <button id="bPrevDir" disabled>预览目录…</button>
    <label style="white-space:nowrap"><input type="checkbox" id="cCopy"> 复制(不移动原片)</label>
    <button id="bMove" class="pri" disabled>把勾选的移过去</button>
    <button id="bExpCsv">导出 CSV…</button>
    <button id="bExpList">导出勾选清单…</button>
    <button id="bAdvise" title="用本地 Ollama 视觉模型看勾选的照片, 给出整组风格判断和逐张调色参数建议">AI 调色建议</button>
    <span id="advRun" class="muted"></span>
    <span id="advOut" title="AI 实时输出"><span id="advOutText"></span></span>
    <button id="bAdvCancel" class="pri" style="display:none" title="中止这次 AI 调色建议 (照片和结果不受影响)">取消 AI</button>
  </div>
</div>

<div id="advice" style="display:none"></div>

<div class="legend">
  <span class="sw" style="background:#27ae60"></span>组内最清晰 &nbsp;&nbsp;
  <span class="sw" style="background:#c0392b"></span>组内疑似模糊 &nbsp;&nbsp;
  <span class="sw" style="background:#2f7fd8"></span>已勾选 &nbsp;&nbsp;
  <span class="sw" style="background:#ff6040"></span>人脸框 &nbsp;&nbsp;
  <span class="sw" style="background:#00d2ff"></span>评分用的眼睛区域 &nbsp;&nbsp;
  <span class="sw" style="background:#00dc00"></span>相机设定的对焦点(仅 Flexible Spot)<br>
  <b>重要</b>: 锐度是眼睛区域的梯度能量÷对比度 (已抵消阴影/欠曝), 但框景大小仍会带偏, <b>只有同一组的帧之间比较才有意义</b>。
  列表按锐度从高到低排, 从上往下扫即可。
</div>

<div id="empty">先在上面选一个照片文件夹, 然后点「开始分析」。</div>
<div id="grid"></div>

<div id="lb">
  <span class="nav" id="navL">&#10094;</span>
  <img id="lbImg" alt="">
  <div class="lt"><span id="lbName"></span><a id="lbOpen">用看图程序打开原图</a><a id="lbOrig">在资源管理器中显示原文件</a></div>
  <div class="hint">&#8592;/&#8594; 切换 &nbsp;&middot;&nbsp; Esc 关闭</div>
  <span class="nav" id="navR">&#10095;</span>
</div>

<div id="msg"></div>

<script>
var api = window.pywebview ? window.pywebview.api : null;
var CARDS = [];          // 当前已加载的全部卡片
var SEL = {};            // 勾选状态: name -> true
var CUR = null;          // 当前文件夹
var FOLDERS = [];        // [{path, state}]  state: run|ok|err
var RUNNING = false;
var OFF = 0, TOTAL = 0, MORE = false, LOADING = false;
var LB = [];             // lightbox 列表 (当前可见的卡片)
var lbi = 0;
var SORTCUR = 'sharp';   // 排序: sharp | group | name
var SECS = {};           // 分节折叠状态: secKey -> true(展开)/false(折叠)

function $(id){ return document.getElementById(id); }

function say(t, bad){
  var m = $('msg');
  m.textContent = t;
  m.className = bad ? 'bad' : '';
  m.style.display = 'block';
  clearTimeout(m._t);
  m._t = setTimeout(function(){ m.style.display='none'; }, bad ? 7000 : 3200);
}

/* ================= 文件夹队列 ================= */
function drawFolders(){
  var box = $('folders');
  box.innerHTML = '';
  FOLDERS.forEach(function(f, idx){
    var d = document.createElement('div');
    d.className = 'fitem ' + f.state;
    var tag = f.state === 'run' ? '分析中' : (f.state === 'ok' ? '已完成' :
              (f.state === 'err' ? '出错' : '待分析'));
    d.innerHTML = '<span class="p"></span><span class="tag"></span>' +
                  '<button title="移除">×</button>';
    d.querySelector('.p').textContent = f.path;
    d.querySelector('.tag').textContent = tag;
    d.querySelector('button').onclick = async function(){
      // 正在分析中的文件夹不能从这里删, 要走「取消」
      if (f.state === 'run'){ say('正在分析中, 请先点「取消」', true); return; }
      FOLDERS.splice(idx, 1);
      if (CUR === f.path) resetView();
      drawFolders();
      // Python 那边也要同步删, 否则它还留着这个路径, 再加回来会被当成"已存在"
      try { await api.remove_folder(f.path); } catch(e){}
    };
    box.appendChild(d);
  });
  updateRun();
}

function updateRun(){
  // 分析过的文件夹(ok/err)也可以再分析一遍, 所以不只数 wait
  var canRun = FOLDERS.some(function(f){ return f.state !== 'run'; });
  $('bRun').disabled = RUNNING || !canRun;
  $('bCancel').style.display = RUNNING ? '' : 'none';
  $('bCancel').disabled = !RUNNING;
}

function setState(path, st){
  FOLDERS.forEach(function(f){ if (f.path === path) f.state = st; });
  drawFolders();
}

$('bCancel').onclick = async function(){
  if (!RUNNING) return;
  if (!confirm('中止分析? 已经算出来的结果会一起丢掉, 文件夹会留在列表里, 可以直接重跑。')) return;
  RUNNING = false;
  updateRun();
  $('status').textContent = '正在停止…';
  // 结果和勾选清掉, 但 FOLDERS 保留 —— 直接再点「开始分析」就能重跑
  SEL = {};
  resetView();
  $('scount').textContent = '0';
  FOLDERS.forEach(function(f){ if (f.state === 'run') f.state = 'wait'; });
  drawFolders();
  say('正在停止后台任务…');
  try {
    // 后端最多要等当前这张算完 (约 0.3s) 才会真的停, 这里别无限等
    await Promise.race([
      api.cancel(),
      new Promise(function(res){ setTimeout(res, 8000); })
    ]);
    say('已取消 — 文件夹还在, 可以直接再点「开始分析」');
  } catch(e){
    say('已发出取消请求, 但后台没回应: ' + e, true);
  }
};

$('bPick').onclick = async function(){
  if (RUNNING) return;
  var dirs = [];
  try {
    dirs = await api.pick_folders();
  } catch(e){
    say('选文件夹失败: ' + e, true);
    return;
  }
  if (!dirs || !dirs.length) return;

  // **必须同步给 Python**, 否则 api.analyze() 看到的队列是空的, 会返回
  // "先选一个照片文件夹", 而界面已经把文件夹标成"分析中"却永远等不到消息。
  try {
    await api.add_folders(dirs);
  } catch(e){
    say('加入队列失败: ' + e, true);
    return;
  }

  var n = 0;
  dirs.forEach(function(d){
    if (FOLDERS.some(function(f){ return f.path === d; })) return;
    FOLDERS.push({path: d, state: 'wait'});
    n++;
  });
  drawFolders();
  if (n) say('已加入 ' + n + ' 个文件夹, 点「开始分析」');
};

$('bRun').onclick = function(){
  if (RUNNING) return;
  // 全部标成 run, 这样之前分析过的文件夹也能重跑一遍
  FOLDERS.forEach(function(f){ f.state = 'run'; });
  RUNNING = true;
  drawFolders();
  updateRun();                    // 立刻刷新按钮, 别等第一条消息才显示取消
  var force = $('cForce').checked;
  $('status').textContent = '正在分析…';
  say(force ? '正在强制重扫 (忽略缓存)…' : '正在分析, 可以随时点「取消」');
  api.analyze($('cFull').checked, 4, force).then(function(r){
    // 注意: analyze() 是 **resolve** 出 {ok:false, error} 而不是 reject,
    // 所以这里必须把文件夹状态退回 'wait' —— 否则全都卡在 'run',
    // updateRun() 会让「开始分析」一直禁用, 「取消」也点不动。
    if (r && r.error) {
      RUNNING = false;
      FOLDERS.forEach(function(f){ if (f.state === 'run') f.state = 'wait'; });
      drawFolders();
      $('status').textContent = '就绪 — 先选文件夹, 再点「开始分析」';
      say(r.error, true);
      updateRun();
    }
  }, function(e){
    RUNNING = false;
    FOLDERS.forEach(function(f){ if (f.state === 'run') f.state = 'wait'; });
    drawFolders();
    say('启动分析失败: ' + e, true);
    updateRun();
  });
  // 强制重扫是一次性语义: 用完自动取消勾选, 免得下次误开又白扫一遍
  if (force) $('cForce').checked = false;
};

/* ================= 轮询进度 =================
   轮询用递归 setTimeout 而不是 setInterval: 后一次一定等前一次回来才排下一次。
   setInterval + async 回调会重入 —— pywebview 的 JS 侧按 valueId 存回调,
   两个 poll() 撞在一起会互相覆盖回调, 消息进了错的任务, 状态就永远停在"分析中"。
   附带好处: Python 卡住时只是进度不更新, 不会堆积请求。 */
var pollTimer = null, pollStarted = false, pollMisses = 0;

async function pollOnce(){
  var msgs = null;
  try {
    if (api) msgs = await api.poll();
  } catch(e){
    msgs = null;
  }
  try {
    if (msgs && msgs.length){
      pollMisses = 0;
      handleMsgs(msgs);
    } else if (RUNNING){
      // 收不到消息但显示在分析 —— 给个提示, 但别太早误报
      // (第一个文件夹要 list + 起 4 个 worker, 前几秒没消息是正常的)
      pollMisses++;
      if (pollMisses === 60){     // 大约 12 秒
        say('分析好像卡住了 (12 秒没有任何进度)。\n' +
            '可以点「取消」重来; 若反复出现请关掉重开程序。', true);
      }
    }
  } catch(e){
    // 单条消息处理出错不能拖死整个轮询, 否则界面会永远停在"分析中"
    say('界面更新出错: ' + e, true);
  } finally {
    pollTimer = setTimeout(pollOnce, 200);
  }
}

function startPolling(){
  if (pollStarted) return;          // pywebviewready 和 页面加载 都可能调到这里
  pollStarted = true;
  pollOnce();
}

function handleMsgs(msgs){
  for (var i=0; i<msgs.length; i++){
    var m = msgs[i];
    if (m[0] === 'log') $('status').textContent = m[1];
    else if (m[0] === 'done') { setState(m[1], 'ok'); openFolder(m[1]); }
    else if (m[0] === 'error') {
      // (文件夹, 错误说明) —— 只显示第一行, 完整 traceback 放到 title 里备查
      var path = m[1][0], msg = String(m[1][1] || '');
      var first = msg.split('\n').filter(function(s){ return s.trim(); })[0] || '未知错误';
      setState(path, 'err');
      var f = FOLDERS.filter(function(x){ return x.path === path; })[0];
      if (f) f.err = msg;
      say('「' + (f ? f.path.split(/[\\\/]/).pop() : path) + '」' + first, true);
    }
    else if (m[0] === 'cancelled') {
      // 后台把没跑完的文件夹放回队列了, 这里把它们的状态改回"待分析"
      (m[1] || []).forEach(function(p){
        var f = FOLDERS.filter(function(x){ return x.path === p; })[0];
        if (f && f.state === 'run') f.state = 'wait';
      });
      drawFolders();
      RUNNING = false; updateRun();
    }
    else if (m[0] === 'idle') {
      RUNNING = false;
      // 刚取消完的话别把"已取消"覆盖成"全部完成"
      if ($('status').textContent !== '正在停止…')
        $('status').textContent = FOLDERS.length
          ? '全部完成 — 在上面点文件夹可以来回切'
          : '就绪 — 先选文件夹, 再点「开始分析」';
      updateRun();
    }
    else if (m[0] === 'advice') { advStop(); renderAdvice(m[1]); }
    else if (m[0] === 'advice_error') {
      advStop();
      setAdvBusy(false);
      say((m[1] && m[1][1]) || 'AI 调色建议失败', true);
    }
    else if (m[0] === 'advice_done') { if (ADV_RUNNING) advStop(); else setAdvBusy(false); }
    else if (m[0] === 'advice_prog') {
      // {folder, phase, done, total, chars}; 解码阶段显示"准备图片 N/M"
      var ap = m[1] || {};
      ADV_CHARS = ap.chars || ADV_CHARS;
      if (ap.phase === 'decode' && ap.total){
        var apEl = $('advRun');
        if (apEl) apEl.textContent = '准备图片 ' + ap.done + '/' + ap.total + '…';
      }
      if (ap.tail) { var o=$('advOutText'); if(o) o.textContent = ap.tail; }
    }
    else if (m[0] === 'advice_cancelled') {
      advStop();
      var acEl = $('advRun'); if (acEl) acEl.textContent = '';
      say('已取消 AI 调色建议');
    }
    else if (m[0] === 'pull') {
      // {model, status, pct, completed, total}; pct 为 null 时只有文字状态
      var p = m[1] || {};
      var txt = '拉取 ' + (p.model || '') + ': ';
      if (p.pct === null || p.pct === undefined || isNaN(Number(p.pct))){
        txt += (p.status || '…');
      } else {
        txt += (Math.round(Number(p.pct) * 10) / 10) + '%';
      }
      $('advProg').textContent = txt;
    }
    else if (m[0] === 'pull_done') {
      // 先取出值: m 是 for 循环里的 var, 异步回调执行时它已经指向别处了
      var doneModel = m[1];
      setAdvPullBusy(false);
      $('advProg').textContent = '';
      say('模型拉取完成: ' + doneModel);
      // 刷新列表并把刚拉好的那个选中 (loadModels 是异步的, 等它填完再选)
      loadModels().then(function(){
        var sel = $('advModel');
        if (!sel || !doneModel) return;
        for (var j = 0; j < sel.options.length; j++){
          if (sel.options[j].value === doneModel){ sel.value = doneModel; break; }
        }
      });
    }
    else if (m[0] === 'pull_error') {
      // [model, message]
      var pe = m[1] || [];
      setAdvPullBusy(false);
      $('advProg').textContent = '';
      say(pe[1] || '模型拉取失败', true);
    }
  }
}

/* ================= 结果 ================= */
function resetView(){
  CUR = null; CARDS = []; OFF = 0; TOTAL = 0; MORE = false; LB = []; lbi = 0;
  $('grid').innerHTML = '';
  $('bar').style.display = 'none';
  $('empty').style.display = '';
  $('empty').textContent = '先在上面选一个照片文件夹, 然后点「开始分析」。';
  clearAdvice();
}

async function openFolder(folder){
  resetView();
  CUR = folder;
  $('empty').textContent = '正在载入…';
  $('status').textContent = folder;
  try {
    var d = await api.get_batch(folder, 0, 60, SORTCUR);
    applyBatch(d);
  } catch(e){
    $('empty').textContent = '载入失败: ' + e;
  }
  // 这个文件夹之前算过 AI 调色建议的话, 直接恢复显示 (没有则收起面板)
  try {
    var a = await api.get_advice(folder);
    if (CUR !== folder) return;          // 等结果期间用户切走了文件夹, 别贴错面板
    if (a) renderAdvice(a); else clearAdvice();
  } catch(e){ clearAdvice(); }
}

/* 换排序要重新从头拉一遍 —— 后端是按 offset 分页的, 顺序变了不能续着接 */
$('fSort').onchange = async function(){
  SORTCUR = this.value;
  if (CUR){ await openFolder(CUR); }
  else { say('已切换排序, 打开一个文件夹后生效'); }
};

async function loadMore(){
  if (!MORE || !CUR || LOADING) return;
  LOADING = true;
  try {
    var d = await api.get_batch(CUR, OFF, 60, SORTCUR);
    applyBatch(d, true);
  } catch(e){ say('载入更多失败: ' + e, true); }
  LOADING = false;
}

/* 滚到接近底部才要下一页 —— 不是一上来就把几千张全拉进来 */
function maybeLoadMore(){
  if (!MORE || LOADING) return;
  var left = document.body.scrollHeight - (window.scrollY + window.innerHeight);
  if (left < 1200) loadMore();
}
window.addEventListener('scroll', maybeLoadMore, {passive: true});

function applyBatch(d, append){
  if (!append){ CARDS = []; $('grid').innerHTML = ''; SECS = {}; }
  OFF = d.off + d.cards.length;
  TOTAL = d.total;
  MORE = d.more;

  var cards = d.cards || [];
  if (SORTCUR === 'sharp'){
    // 不分节: 沿用以前的平铺网格
    var box = $('grid');
    if (!append){
      box.innerHTML = '';
      var g = document.createElement('div');
      g.className = 'cards'; g.id = 'flat';
      box.appendChild(g);
    }
    var flat = $('flat');
    if (!flat){ var g2 = document.createElement('div'); g2.className='cards'; g2.id='flat';
                $('grid').appendChild(g2); flat = g2; }
    var frag = document.createDocumentFragment();
    cards.forEach(function(c){ frag.appendChild(makeCard(c)); });
    flat.appendChild(frag);
  } else {
    // 分节: 同组的卡片进同一个 .sec, 标题条插在它前面
    var bySec = {}, order = [];
    cards.forEach(function(c){
      var k = c.group_size > 1 ? 'g' + c.group : 'solo';
      if (!bySec[k]){ bySec[k] = []; order.push(k); }
      bySec[k].push(c);
    });
    order.forEach(function(k){
      var list = bySec[k];
      var gid = list[0].group, gs = list[0].group_size;
      var warn = list.some(function(c){ return c.uncertain; });
      var sec = document.createElement('div');
      sec.className = 'sec'; sec.dataset.sec = k;
      if (SECS[k] === false) sec.classList.add('closed');
      var head = document.createElement('div');
      head.className = 'sechead';
      head.innerHTML = '<span class="caret">&#9662;</span>' +
        '<span class="t"></span><span class="n"></span>' +
        (warn ? '<span class="tag warn">&#9888; 主体存疑</span>' : '');
      head.querySelector('.t').textContent =
        gs > 1 ? ('相似帧组 ' + gid) : '单张 (没有可比对的对象)';
      head.querySelector('.n').textContent = ' ' + list.length + ' 张';
      head.onclick = function(){
        var closed = sec.classList.toggle('closed');
        SECS[k] = !closed;
        maybeLoadMore();
      };
      var box = document.createElement('div');
      box.className = 'cards';
      var frag2 = document.createDocumentFragment();
      list.forEach(function(c){ frag2.appendChild(makeCard(c)); });
      box.appendChild(frag2);
      sec.appendChild(head);
      sec.appendChild(box);
      $('grid').appendChild(sec);
    });
  }

  $('bar').style.display = '';
  if (!ADV_MODELS_OK) loadModels();   // 操作栏第一次露出来时补一次; 成功读到过就不再重复
  $('empty').style.display = TOTAL ? 'none' : '';

  // AF 区域下拉只填一次
  var sel = $('fArea');
  if (sel.options.length <= 1){
    (d.areas || []).forEach(function(a){
      var o = document.createElement('option');
      o.value = a; o.textContent = a;
      sel.appendChild(o);
    });
  }
  $('tcount').textContent = TOTAL;
  $('status').textContent = d.folder + '  ·  ' + TOTAL + ' 张  ·  检出人脸 ' +
    d.n_face + '  ·  可对比的相似帧 ' + d.n_dup + ' 组  ·  其中疑似模糊 ' + d.n_soft + ' 张';
  applyFilter();
}

function makeCard(c){
  var el = document.createElement('div');
  el.className = 'card ' + c.cls;
  el.dataset.sharp = c.sharp;
  el.dataset.value = (c.value == null ? '' : c.value);
  el.dataset.ratio = c.ratio_v;
  el.dataset.best  = c.best;
  el.dataset.multi = c.multi;
  el.dataset.multiFace = c.multi_face;
  el.dataset.uncertain = c.uncertain;
  el.dataset.face  = c.face;
  el.dataset.area  = c.area;
  el.dataset.name  = c.name;

  el.innerHTML =
    '<div class="pick"><input type="checkbox" class="cb"></div>' +
    '<img alt="">' +
    '<div class="info">' +
      (c.badge || c.warn ? '<span class="badge"></span>' : '') +
      '<div class="name"></div><div class="sc"></div><div class="meta"></div>' +
      '<div class="ops">' +
        '<button class="op" data-a="open" title="用系统默认看图程序打开原图">打开原图</button>' +
        '<button class="op" data-a="locate" title="在资源管理器里定位并选中这个文件">在文件夹中显示</button>' +
      '</div>' +
      '<div class="facepick"></div>' +
    '</div>';

  if (c.badge || c.warn) el.querySelector('.badge').textContent = c.badge + c.warn;
  if (c.warn) el.querySelector('.badge').title =
    '这张多脸照片里"最清楚的那张脸"在同组不同帧可能不是同一个人，组内锐度仅供参考';
  el.querySelector('.name').textContent = c.name;
  el.querySelector('.sc').textContent = c.score + c.ratio;
  el.querySelector('.meta').textContent = c.meta;

  // 多脸图: 给个"换主体"下拉。face_metrics 随卡片一起发过来了, 不用再问 Python
  var fp = el.querySelector('.facepick');
  var fm = c.face_metrics || [];
  if (c.n_faces > 1 && fm.length > 1){
    var sel = document.createElement('select');
    sel.title = '程序默认选"眼部锐度最高"的那张脸, 但合影里主角不一定是它 —— 可以手动改';
    fm.forEach(function(m){
      var o = document.createElement('option');
      o.value = m.idx;
      o.textContent = '#' + (m.idx + 1) + '  锐度 ' + Math.round(m.eye)
                    + '  宽 ' + m.w + 'px';
      if (m.idx === c.subject_idx) o.selected = true;
      sel.appendChild(o);
    });
    var lab = document.createElement('span');
    lab.className = 'fplab';
    lab.textContent = '主体';
    fp.appendChild(lab);
    fp.appendChild(sel);
    sel.onchange = async function(ev){
      ev.stopPropagation();
      var idx = parseInt(sel.value, 10);
      if (idx === c.subject_idx) return;
      sel.disabled = true;
      say('正在把 ' + c.name + ' 的主体换成第 ' + (idx + 1) + ' 张脸…');
      try {
        var r = await api.set_subject(CUR, c.name, idx);
        if (r && r.error){ say(r.error, true); sel.value = c.subject_idx; }
        else {
          say('已换主体: ' + c.name + '  眼锐度 ' + r.eye_sharp
              + (r.group ? '  组' + r.group : ''));
          // 分组可能变了, 整页重拉最稳妥
          if (CUR) await openFolder(CUR);
        }
      } catch(e){ say('换主体失败: ' + e, true); sel.value = c.subject_idx; }
      sel.disabled = false;
    };
  }

  // 别让点按钮冒泡到卡片(卡片点了会切文件夹)
  el.querySelectorAll('.op').forEach(function(b){
    b.onclick = async function(ev){
      ev.stopPropagation();
      var act = b.dataset.a;
      try {
        var r = act === 'open' ? await api.open_original(CUR, c.name)
                               : await api.show_in_explorer(CUR, c.name);
        if (r && r.error) say(r.error, true);
        else say(act === 'open' ? '已用系统看图程序打开 ' + c.name
                                 : '已在资源管理器中定位 ' + c.name);
      } catch(e){ say('打不开: ' + e, true); }
    };
  });

  var img = el.querySelector('img');
  img.src = c.thumb;
  img.alt = c.name;
  img.onclick = function(){ openLb(c.name); };

  var cb = el.querySelector('.cb');
  cb.checked = !!SEL[c.name];
  cb.onchange = function(){ toggle(c.name, cb.checked, el); };

  el.dataset.sel = cb.checked ? '1' : '0';
  if (cb.checked) el.classList.add('sel');
  return el;
}

/* 队列条上点已完成文件夹 -> 切回它 */
document.querySelector('#folders').addEventListener('click', function(e){
  var it = e.target.closest('.fitem');
  if (!it || e.target.tagName === 'BUTTON') return;
  var p = it.querySelector('.p').textContent;
  if (it.classList.contains('ok')) openFolder(p);
});

/* ================= 筛选 ================= */
function applyFilter(){
  var value = $('fValue').value;
  var sharp = $('fSharp').value, ratio = $('fRatio').value;
  var best = $('fBest').checked, multi = $('fMulti').checked;
  var mface = $('fMultiFace').checked;
  var unc = $('fUncertain').checked;
  var face = $('fFace').value, area = $('fArea').value;
  var vis = [];
  document.querySelectorAll('.card').forEach(function(c){
    var d = c.dataset, ok = true;
    if (value !== '' && (d.value === '' || parseFloat(d.value) < parseFloat(value))) ok = false;
    if (ok && sharp !== '' && parseFloat(d.sharp) < parseFloat(sharp)) ok = false;
    if (ok && ratio !== '' && parseFloat(d.ratio)*100 < parseFloat(ratio)) ok = false;
    if (ok && best && d.best !== '1') ok = false;
    if (ok && multi && d.multi !== '1') ok = false;
    if (ok && mface && d.multiFace !== '1') ok = false;
    if (ok && unc && d.uncertain !== '1') ok = false;
    if (ok && face === '1' && d.face !== '1') ok = false;
    if (ok && face === '0' && d.face !== '0') ok = false;
    if (ok && area !== '' && d.area !== area) ok = false;
    c.style.display = ok ? '' : 'none';
    if (ok) vis.push(c.dataset.name);
  });
  $('vcount').textContent = vis.length;
  // 整节都被筛掉就把标题也藏了, 否则会留一条空的"相似帧组 N"
  document.querySelectorAll('.sec').forEach(function(s){
    var any = Array.prototype.some.call(s.querySelectorAll('.card'),
                                         function(c){ return c.style.display !== 'none'; });
    s.style.display = any ? '' : 'none';
  });
  LB = vis;
  if (lbi >= LB.length) lbi = 0;
  $('bMove').disabled = countSel() === 0;
  maybeLoadMore();
}

['fValue','fSharp','fRatio','fBest','fMulti','fMultiFace','fUncertain','fFace','fArea'].forEach(function(id){
  $(id).addEventListener('input', applyFilter);
  $(id).addEventListener('change', applyFilter);
});

$('bReset').onclick = function(){
  $('fValue').value=''; $('fSharp').value=''; $('fRatio').value='';
  $('fBest').checked=false; $('fMulti').checked=false;
  $('fMultiFace').checked=false; $('fUncertain').checked=false;
  $('fFace').value=''; $('fArea').value='';
  applyFilter();
};

/* ================= 勾选 ================= */
function countSel(){ var n=0; for (var k in SEL) if (SEL[k]) n++; return n; }
function selNames(){ return Object.keys(SEL).filter(function(k){ return SEL[k]; }); }

function toggle(name, on, el){
  SEL[name] = on;
  if (on) el.classList.add('sel'); else el.classList.remove('sel');
  $('scount').textContent = countSel();
  $('bMove').disabled = countSel() === 0;
}

$('bAll').onclick = function(){
  document.querySelectorAll('.card').forEach(function(c){
    if (c.style.display === 'none') return;
    var cb = c.querySelector('.cb');
    cb.checked = true;
    toggle(c.dataset.name, true, c);
  });
};
$('bNone').onclick = function(){
  document.querySelectorAll('.card').forEach(function(c){
    var cb = c.querySelector('.cb');
    cb.checked = false; toggle(c.dataset.name, false, c);
  });
};
$('bInv').onclick = function(){
  document.querySelectorAll('.card').forEach(function(c){
    if (c.style.display === 'none') return;
    var cb = c.querySelector('.cb');
    cb.checked = !cb.checked;
    toggle(c.dataset.name, cb.checked, c);
  });
};

/* ================= 大图 ================= */
var lbBusy = false;
async function openLb(name){
  LB = LB.length ? LB : visNames();
  lbi = LB.indexOf(name);
  if (lbi < 0) lbi = 0;
  $('lb').style.display = 'flex';
  await showLb();
}

function visNames(){
  var a = [];
  document.querySelectorAll('.card').forEach(function(c){
    if (c.style.display !== 'none') a.push(c.dataset.name);
  });
  return a;
}

async function showLb(){
  if (!LB.length) return;
  var name = LB[lbi];
  if (!name) return;
  $('lbName').textContent = name;
  $('lbImg').src = '';
  if (lbBusy) return;
  lbBusy = true;
  try {
    var r = await api.get_big(CUR, name);
    if (r && r.error){ $('lbImg').alt = r.error; }
    else if (r && r.img){ $('lbImg').src = r.img; }
  } catch(e){ $('lbImg').alt = String(e); }
  lbBusy = false;
}

function navLb(d){
  if (!LB.length) return;
  lbi = (lbi + d + LB.length) % LB.length;
  showLb();
}
$('navL').onclick = function(){ navLb(-1); };
$('navR').onclick = function(){ navLb(1); };
$('lb').addEventListener('click', function(e){ if (e.target === $('lb')) $('lb').style.display='none'; });
$('lbOrig').onclick = async function(){
  var r = await api.show_in_explorer(CUR, LB[lbi]);
  if (r && !r.ok) say(r.error, true);
  return false;
};
$('lbOpen').onclick = async function(){
  var r = await api.open_original(CUR, LB[lbi]);
  if (r && !r.ok) say(r.error, true);
  return false;
};
document.addEventListener('keydown', function(e){
  if ($('lb').style.display !== 'flex') return;
  if (e.key === 'Escape') $('lb').style.display = 'none';
  else if (e.key === 'ArrowRight') navLb(1);
  else if (e.key === 'ArrowLeft') navLb(-1);
});

$('cPrev').onchange = function(){
  var on = this.checked;
  $('prevDir').disabled = !on;
  $('bPrevDir').disabled = !on;
  if (on && !$('prevDir').value){
    // 默认放在目标文件夹旁边的 预览图 子目录里
    var d = $('dest').value.trim();
    if (d) $('prevDir').value = d.replace(/[\\\/]+$/, '') + '\\预览图';
  }
};

$('bPrevDir').onclick = async function(){
  var d = await api.pick_dest();
  if (d) $('prevDir').value = d;
};

$('bMove').onclick = async function(){
  var names = selNames();
  var dest = $('dest').value.trim();
  var copy = $('cCopy').checked;
  var prevDir = $('cPrev').checked ? $('prevDir').value.trim() : '';
  if (!names.length) return say('还没有勾选照片', true);
  if (!dest) return say('先点「选择目标…」', true);
  if ($('cPrev').checked && !prevDir) return say('勾了生成预览, 但没选预览目录', true);
  var msg = '即将' + (copy ? '复制' : '移动') + ' ' + names.length + ' 张到:\n\n' + dest;
  if (prevDir) msg += '\n\n同时生成 ' + names.length + ' 张预览 jpg (长边 1600) 到:\n' + prevDir;
  msg += '\n\n同名 .xmp/.acr 会一起带走; 目标已有同名文件会跳过, 不覆盖。\n\n确定继续?';
  if (!confirm(msg)) return;

    else if (r && r.ok) say(r.msg + '  (' + r.mb + ' MB)');
    else say('有 ' + r.failed + ' 个文件失败', true);

$('bExpCsv').onclick = async function(){
  if (!CUR) return;

  if (r && r.cancelled) return;

  else say((r && r.error) || '导出失败', true);
};

$('bExpList').onclick = async function(){
  var names = selNames();
  if (!names.length) return say('还没有勾选照片', true);
  var r = await api.export_list(CUR, names);
  if (r && r.cancelled) return;

  else say((r && r.error) || '导出失败', true);

/* ================= AI 调色建议 ================= */
var ADV_BUSY = false;   // 正在等后端 / Ollama 返回
var ADV_KEYS = [
  ['exposure', '曝光'], ['temperature', '色温'], ['contrast', '对比'],
  ['highlights', '高光'], ['shadows', '阴影'], ['saturation', '饱和'],
  ['vibrance', '鲜艳度']
];

function setAdvBusy(on){
  ADV_BUSY = !!on;
  var b = $('bAdvise'); if (b) b.disabled = ADV_BUSY;
  var r = $('bAdvRerun'); if (r) r.disabled = ADV_BUSY;
}

/* ---- 实时进度 + 中止 ----
   计时用递归 setTimeout (和本文件的轮询约定一致, 不能用 setInterval):
   每次 tick 排下一次, advStop 清掉待定的 timer, 保证不泄漏也不叠加。 */
var ADV_START = 0, ADV_CHARS = 0, ADV_TIMER = null, ADV_RUNNING = false;

function advTick(){
  if (!ADV_RUNNING) return;
  var el = $('advRun');
  if (el){
    var txt = '已 ' + Math.floor((Date.now() - ADV_START) / 1000) + 's';
    if (ADV_CHARS > 0) txt += ' · 收到 ' + ADV_CHARS + ' 字';
    el.textContent = txt;   // 全是本地数值, 不用 innerHTML
  }
  ADV_TIMER = setTimeout(advTick, 1000);
}

function advStart(){
  // 防重入: 万一上一次的 timer 还在, 先清掉再开新的, 绝不让两个 tick 链并存
  if (ADV_TIMER){ clearTimeout(ADV_TIMER); ADV_TIMER = null; }
  var ot = $('advOutText'); if (ot) ot.textContent = '';   // 清掉上一轮残留的实时输出
  ADV_START = Date.now();
  ADV_CHARS = 0;
  ADV_RUNNING = true;
  var b = $('bAdvCancel'); if (b) b.style.display = '';
  setAdvBusy(true);
  advTick();                   // 立刻显示"已 0s", 不用等第一秒
}

function advStop(){
  if (ADV_TIMER){ clearTimeout(ADV_TIMER); ADV_TIMER = null; }
  ADV_RUNNING = false;
  var ot = $('advOutText'); if (ot) ot.textContent = '';
  var b = $('bAdvCancel'); if (b) b.style.display = 'none';
  var el = $('advRun'); if (el) el.textContent = '';
  setAdvBusy(false);
}

/* ---- 模型下拉 / 拉取 ---- */
var ADV_MODELS_OK = false;      // 成功读到过模型列表; 空列表或读失败时保持 false, 允许再自动试一次
var ADV_MODELS_LOADING = false; // 防重入: 下拉可能被「刷新模型」和自动加载同时触发
var ADV_PULL_BUSY = false;      // 拉取中: 等 pull_done / pull_error 才放开按钮

function setAdvPullBusy(on){
  ADV_PULL_BUSY = !!on;
  var b = $('bAdvPull'); if (b) b.disabled = ADV_PULL_BUSY;
}

function advSelClear(sel){
  while (sel.firstChild) sel.removeChild(sel.firstChild);
}

function advSelPlaceholder(sel, text){
  advSelClear(sel);
  var o = document.createElement('option');
  o.value = '';
  o.disabled = true;
  o.selected = true;
  o.textContent = text;
  sel.appendChild(o);
}

/* 读本机 Ollama 已安装的视觉模型填进 #advModel。
   模型名/参数大小是外部字符串, 全部走 createElement/textContent, 绝不用 innerHTML。 */
async function loadModels(){
  var sel = $('advModel');
  if (!sel || ADV_MODELS_LOADING) return;
  ADV_MODELS_LOADING = true;
  var prev = sel.value;
  sel.disabled = true;
  advSelPlaceholder(sel, '正在读取本地模型…');
  try {
    var r = await api.list_models();
    var models = (r && r.ok && r.models) ? r.models : [];
    advSelClear(sel);
    if (models.length){
      models.forEach(function(m){
        var o = document.createElement('option');
        o.value = String(m.name);
        var extra = '';
        if (m.parameter_size) extra = ' (' + String(m.parameter_size) + ')';
        else if (m.size) extra = ' (' + (Math.round(m.size / 1073741824 * 10) / 10) + 'GB)';
        o.textContent = String(m.name) + extra;
        sel.appendChild(o);
      });
      // 还选着原来那个就保持选中, 否则回到第一项
      var keep = false;
      for (var i = 0; i < sel.options.length; i++)
        if (sel.options[i].value === prev) keep = true;
      if (keep) sel.value = prev;
      ADV_MODELS_OK = true;
    } else {
      advSelPlaceholder(sel, '（没有本地视觉模型, 请先拉取）');
      ADV_MODELS_OK = false;
      if (r && r.error) say(r.error, true);
    }
  } catch(e){
    advSelPlaceholder(sel, '（读取模型列表失败, 点「刷新模型」重试）');
    ADV_MODELS_OK = false;
    say('获取模型列表失败: ' + e, true);
  }
  sel.disabled = false;
  ADV_MODELS_LOADING = false;
}

async function pullModel(){
  var name = $('advPullName').value.trim();
  if (!name) return say('先填要拉取的模型名, 例如 qwen2.5vl:7b', true);
  if (ADV_PULL_BUSY) return;
  if (!confirm('将向本机 Ollama 拉取模型 ' + name + ', 可能下载数 GB, 确定继续?')) return;
  setAdvPullBusy(true);
  $('advProg').textContent = '拉取 ' + name + ': 正在开始…';
  say('开始拉取 ' + name + ' …');
  try {
    var r = await api.pull_model(name);
    if (r && r.error){
      // 后端明确拒绝时一般不会再发 pull_error, 这里先把按钮放开
      setAdvPullBusy(false);
      $('advProg').textContent = '';
      say(r.error, true);
    }
    // 成功的话进度走 poll 消息, 按钮等 pull_done / pull_error 再放开
  } catch(e){
    setAdvPullBusy(false);
    $('advProg').textContent = '';
    say('拉取请求失败: ' + e, true);
  }
}

/* ---- Ollama 服务地址 (保存进工具目录的 cull_config.json) ---- */
var ADV_SETTINGS_LOADED = false;  // waitApi 可能被触发不止一次, 地址只回填一次

/* 启动时读回后端保存的地址填进 #advHost; 读不到就静默忽略, 不在启动时弹错 */
async function loadOllamaSettings(){
  if (ADV_SETTINGS_LOADED) return;
  ADV_SETTINGS_LOADED = true;
  try {
    var s = await api.get_ollama_settings();
    if (!s || !s.url) return;
    var el = $('advHost');
    if (el) el.value = String(s.url).replace(/\/+$/, '');
  } catch(e){ /* 桥/后端还没就绪, 用户也可以手动填, 不打扰 */ }
}

async function saveOllamaSettings(){
  var b = $('bAdvSave');
  var url = $('advHost').value.trim();
  if (!url) return say('请填 Ollama 地址, 例如 127.0.0.1:11434', true);
  if (b) b.disabled = true;
  try {
    var r = await api.save_ollama_settings({url: url});
    if (r && r.ok){
      say('已保存 Ollama 地址: ' + ((r.settings && r.settings.url) || url));
      loadModels();   // 服务器可能变了, 按新地址重读模型下拉
    } else {
      say((r && r.error) || '保存 Ollama 地址失败', true);
    }
  } catch(e){
    say('保存 Ollama 地址失败: ' + e, true);
  } finally {
    if (b) b.disabled = false;
  }
}

function mkEl(tag, cls, text){
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text !== undefined && text !== null) d.textContent = String(text);
  return d;
}

function clearAdvice(){
  var box = $('advice');
  if (!box) return;
  box.style.display = 'none';
  box.innerHTML = '';
}

/* 调整量带正负号; 模型偶尔会回非数字字符串, 原样显示但先转成文本 */
function fmtAdj(v){
  if (v === null || v === undefined || v === '') return '—';
  var n = Number(v);
  if (!isFinite(n)) return String(v);
  return (n > 0 ? '+' : '') + String(Math.round(n * 100) / 100);
}

function advList(title, arr){
  var w = mkEl('div', 'advcol');
  w.appendChild(mkEl('div', 'advh', title));
  var ul = document.createElement('ul');
  var items = (arr || []).filter(function(t){
    return t !== null && t !== undefined && String(t).trim() !== '';
  });
  if (!items.length){
    ul.appendChild(mkEl('li', 'muted', '（无）'));
  } else {
    items.forEach(function(t){ ul.appendChild(mkEl('li', '', String(t))); });
  }
  w.appendChild(ul);
  return w;
}

/* 面板里的每个字符串都可能是模型输出, 全部走 createElement/textContent, 绝不用 innerHTML */
function renderAdvice(payload){
  var box = $('advice');
  if (!box) return;
  box.innerHTML = '';
  if (!payload){ box.style.display = 'none'; return; }

  var adv = payload.advice || {};

  var head = mkEl('div', 'advhead');
  head.appendChild(mkEl('b', '', 'AI 调色建议'));
  if (payload.model) head.appendChild(mkEl('span', 'muted advmodel', '模型: ' + payload.model));
  if (payload.gpu) head.appendChild(mkEl('span', 'advtag', 'GPU'));
  head.appendChild(mkEl('div', 'sp'));
  var rerun = mkEl('button', 'op', '重新分析风格');
  rerun.id = 'bAdvRerun';
  rerun.title = '对当前勾选的照片重新跑一次 AI 调色建议';
  // 带上 #dest: 照片多半已经被搬过去了, 得从目标目录找 (app 会先找 dest 再回原目录)
  rerun.onclick = function(){ runAdvise(selNames(), $('dest').value.trim()); };
  rerun.disabled = ADV_BUSY;
  head.appendChild(rerun);
  box.appendChild(head);

  if (payload.ok === false){
    box.appendChild(mkEl('div', 'advstyle',
      payload.error ? String(payload.error) : 'AI 调色建议失败'));
    box.style.display = 'block';
    return;
  }

  if (adv.group_style) box.appendChild(mkEl('div', 'advstyle', String(adv.group_style)));

  var cols = mkEl('div', 'advcols');
  cols.appendChild(advList('存在的问题', adv.issues));
  cols.appendChild(advList('修改建议', adv.suggestions));
  box.appendChild(cols);

  if (payload.sampled){
    var nsent = (payload.sent === null || payload.sent === undefined) ? '?' : payload.sent;
    var ntotal = (payload.total === null || payload.total === undefined) ? '?' : payload.total;
    box.appendChild(mkEl('div', 'advnote', '已按比例抽取 ' + nsent + ' / ' + ntotal + ' 张送模型'));
  }

  var imgs = adv.images || [];
  if (imgs.length){
    var t = document.createElement('table');
    t.className = 'advtable';
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    htr.appendChild(mkEl('th', '', '文件'));
    ADV_KEYS.forEach(function(k){ htr.appendChild(mkEl('th', 'advnum', k[1])); });
    htr.appendChild(mkEl('th', '', '理由'));
    thead.appendChild(htr);
    t.appendChild(thead);
    var tb = document.createElement('tbody');
    imgs.forEach(function(im){
      var tr = document.createElement('tr');
      tr.appendChild(mkEl('td', 'advname',
        (im.name === null || im.name === undefined) ? '' : im.name));
      ADV_KEYS.forEach(function(k){ tr.appendChild(mkEl('td', 'advnum', fmtAdj(im[k[0]]))); });
      tr.appendChild(mkEl('td', 'advreason',
        (im.reason === null || im.reason === undefined) ? '' : im.reason));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    box.appendChild(t);
  }
  box.style.display = 'block';
}

async function runAdvise(names, dest){
  if (!CUR) return;
  if (!names || !names.length) return say('还没有勾选照片', true);
  say('正在请求 AI 调色建议…');
  advStart();   // 显示计时/收字数 + 「取消 AI」; 终态由 poll 分支 advStop
  try {
    var r = await api.advise(CUR, names, dest, ($('advModel').value || ''));
    if (r && r.error){
      // 后端明确报错时一般不会再发 advice_done, 这里先把按钮放开
      setAdvBusy(false);
      say(r.error, true);
    }
  } catch(e){
    setAdvBusy(false);
    say('请求失败: ' + e, true);
  }
}

// 同样带上 #dest: 照片可能已经搬走, 从目标目录读 (没填就回原照片目录)
$('bAdvise').onclick = function(){ runAdvise(selNames(), $('dest').value.trim()); };
// 中止进行中的 AI 调色建议: 只置后端的取消标志, 解码循环/流式读取自己会停;
// 界面靠 advice_cancelled / advice_done 这两个 poll 消息收尾 (不在这里 advStop)
$('bAdvCancel').onclick = async function(){
  try {
    await api.cancel_advise();
    say('正在取消…');
  } catch(e){
    say('取消失败: ' + e, true);
  }
};
$('bAdvRefresh').onclick = function(){ loadModels(); };
$('bAdvSave').onclick = saveOllamaSettings;
$('bAdvPull').onclick = pullModel;

/* pywebview 的桥比页面脚本晚一点就位, 装好了再启动轮询 */
function waitApi(){
  if (window.pywebview && window.pywebview.api){
    api = window.pywebview.api;
    if (!ADV_MODELS_OK) loadModels();   // 桥一就位就把模型下拉填上 (读不到也不影响别的)
    loadOllamaSettings();               // 顺带读回后端保存的 Ollama 地址 (失败静默)
    syncQueue();
    if (!pollStarted) startPolling();
    return;
  }
  setTimeout(waitApi, 100);
}

/* 命令行带进来的文件夹是 Python 那边记住的, 这里拉一次显示出来 */
async function syncQueue(){
  try {
    var q = await api.get_queue();
    (q.queue || []).forEach(function(p){
      if (!FOLDERS.some(function(f){ return f.path === p; }))
        FOLDERS.push({path: p, state: 'wait'});
    });
    (q.done || []).forEach(function(p){
      if (!FOLDERS.some(function(f){ return f.path === p; }))
        FOLDERS.push({path: p, state: 'ok'});
    });
    drawFolders();
  } catch(e){ /* 桥还没完全就位, 下次再试 */ }
}
window.addEventListener('pywebviewready', function(){ waitApi(); });
waitApi();
</script>
